<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
/* =========================================================
   ★★★★★ 所有要修改的內容都在這裡 ★★★★★
   之後你只需要改這一區，不用動下面的程式。
   ========================================================= */

const CONFIG = {
  /* 頁籤標題 */
  pageTitle: "伊莫十月公益回饋",

  /* 主圖：圖片和 html 放同一個資料夾 */
  heroImage: "valorant-event.png",
  heroAlt: "伊莫十月公益回饋",

  /* 上方文字 */
  eyebrow: "伊莫十月公益回饋",
  title: "伊莫十月公益回饋領取",
  subtitle: "補償期間內可點擊立即領取，聯絡活動人員查看領取方式，數量有限，請盡快領取。",

  /* 資訊卡 */
  rewardLabel: "回饋內容",
  rewardText: "輝晶隨機發放",

  timeLabel: "領取時間",
  timeText: "2026/10/01 00:00 ～ 2026/10/31 23:59",

  /* 領取區塊 */
  claimTag: "伊莫十月公益回饋",
  claimTitleLine1: "一鍵領取",
  claimTitleLine2: "伊莫十月公益回饋",
  claimDesc: "限時開放，剩餘名額有限。點擊下方按鈕即可聯絡客服領取。",
  claimButtonText: "前往立即領取",
  claimSafeText: "安全驗證・官方連結",

  /* ★ 改成你的 LINE 連結即可 */
  lineLink: "https://lin.ee/6X6lD6j",

  /* 底部小字 */
  footerText: "※ 活動內容與領取名額僅限一次，不得重複領取。"
};
</script>

<title></title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

:root{
  --bg1:#f4fbff;
  --bg2:#dff0ff;
  --bg3:#bfdfff;
  --card:#ffffff;
  --card2:rgba(255,255,255,.72);
  --line:rgba(112,168,255,.28);
  --line-strong:rgba(98,153,255,.45);
  --text:#214166;
  --muted:#5f7d9e;
  --accent:#6bbcff;
  --accent2:#8d7dff;
  --accent3:#b7ecff;
  --highlight:#fff7b7;
  --buttonText:#19406f;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    "PingFang TC",
    Arial,
    sans-serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(181,239,255,.9), transparent 28%),
    radial-gradient(circle at 88% 12%, rgba(173,186,255,.58), transparent 26%),
    radial-gradient(circle at 30% 82%, rgba(214,246,255,.75), transparent 22%),
    linear-gradient(180deg, #eef9ff 0%, #deefff 42%, #d2e8ff 100%);
  overflow-x:hidden;
  position:relative;
}

body::before,
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}
body::before{
  background:
    linear-gradient(130deg, rgba(255,255,255,.34), transparent 35%, rgba(255,255,255,.14) 58%, transparent 72%),
    radial-gradient(circle at 82% 22%, rgba(255,255,255,.72) 0 5px, transparent 6px),
    radial-gradient(circle at 76% 18%, rgba(255,255,255,.75) 0 3px, transparent 4px),
    radial-gradient(circle at 66% 28%, rgba(255,255,255,.72) 0 4px, transparent 5px),
    radial-gradient(circle at 26% 16%, rgba(255,255,255,.65) 0 3px, transparent 4px),
    radial-gradient(circle at 18% 36%, rgba(255,255,255,.55) 0 4px, transparent 5px);
  opacity:.95;
}
body::after{
  background:
    radial-gradient(circle at 20% 20%, rgba(130,208,255,.23), transparent 20%),
    radial-gradient(circle at 76% 64%, rgba(154,145,255,.18), transparent 22%),
    radial-gradient(circle at 50% 95%, rgba(255,255,255,.75), transparent 18%);
}

.bg-grid{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(rgba(105,170,255,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(105,170,255,.10) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(to bottom, rgba(0,0,0,.92), rgba(0,0,0,.14));
}

.glow{
  position:fixed;
  border-radius:50%;
  filter:blur(84px);
  pointer-events:none;
  z-index:0;
}
.glow.one{
  width:280px;height:280px;top:-80px;right:-80px;
  background:rgba(133,202,255,.52);
}
.glow.two{
  width:260px;height:260px;bottom:60px;left:-90px;
  background:rgba(176,197,255,.34);
}

.page{
  width:min(100%, 760px);
  margin:0 auto;
  padding:18px 16px 40px;
  position:relative;
  z-index:1;
}

.hero{
  overflow:hidden;
  border-radius:26px;
  border:1px solid rgba(255,255,255,.7);
  background:linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.52));
  box-shadow:
    0 22px 48px rgba(99,149,214,.16),
    0 0 0 1px rgba(150,203,255,.16) inset,
    0 0 32px rgba(176,204,255,.18);
  backdrop-filter:blur(8px);
}
.hero img{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:16/9;
  object-fit:cover;
}

.intro{
  margin-top:22px;
  text-align:center;
  padding:0 8px;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:9px 16px;
  border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(235,246,255,.86));
  border:1px solid rgba(135,197,255,.55);
  color:#5a84c7;
  font-size:11px;
  font-weight:1000;
  letter-spacing:.16em;
  box-shadow:0 10px 26px rgba(123,181,246,.14);
}
.eyebrow::before{
  content:"✦";
  font-size:12px;
  color:#8c83ff;
  text-shadow:0 0 10px rgba(140,131,255,.44);
}

h1{
  margin:16px 0 8px;
  font-size:38px;
  line-height:1.12;
  font-weight:1000;
  letter-spacing:-.03em;
  color:#2c5c9a;
  text-shadow:0 4px 18px rgba(142,174,255,.2);
}
.subtitle{
  width:min(100%, 620px);
  margin:0 auto;
  color:var(--muted);
  font-size:14px;
  line-height:1.85;
}

.info{
  margin-top:24px;
  padding:18px;
  border-radius:24px;
  background:linear-gradient(180deg, rgba(255,255,255,.82), rgba(247,251,255,.7));
  border:1px solid rgba(141,189,255,.38);
  box-shadow:0 18px 40px rgba(103,149,214,.12);
  backdrop-filter:blur(10px);
}
.row{
  display:flex;
  align-items:flex-start;
  gap:14px;
  padding:14px 15px;
  border-radius:16px;
  background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(242,248,255,.75));
  border:1px solid rgba(173,210,255,.35);
  box-shadow:0 8px 18px rgba(125,170,232,.08);
}
.row + .row{margin-top:10px}
.label{
  flex:0 0 96px;
  color:#6b8fc6;
  font-size:13px;
  font-weight:900;
}
.value{
  flex:1;
  color:#224467;
  font-size:14px;
  line-height:1.62;
  word-break:break-word;
}

.claim-panel{
  margin-top:22px;
  padding:24px;
  border-radius:28px;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(180deg, rgba(255,255,255,.88), rgba(236,246,255,.72));
  border:1px solid rgba(148,195,255,.4);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.34) inset,
    0 22px 48px rgba(100,146,216,.16),
    0 0 30px rgba(160,204,255,.12);
  backdrop-filter:blur(10px);
}
.claim-panel::before{
  content:"";
  position:absolute;
  inset:-30% auto auto -10%;
  width:280px;
  height:280px;
  background:radial-gradient(circle, rgba(188,235,255,.65), transparent 62%);
  pointer-events:none;
}
.claim-panel::after{
  content:"✦ ✧ ✦";
  position:absolute;
  right:24px;
  top:20px;
  font-size:16px;
  letter-spacing:8px;
  color:#9da0ff;
  opacity:.75;
}

.claim-tag{
  position:relative;
  z-index:1;
  color:#7d8fff;
  font-size:13px;
  font-weight:1000;
  letter-spacing:.12em;
}
.claim-title{
  position:relative;
  z-index:1;
  margin-top:12px;
  font-weight:1000;
  line-height:1.08;
  letter-spacing:-.03em;
  color:#2b5d9d;
}
.claim-title .line1,
.claim-title .line2{
  display:block;
  font-size:40px;
  text-shadow:0 4px 18px rgba(152,186,255,.24);
}
.claim-title .line2{margin-top:4px}
.claim-desc{
  position:relative;
  z-index:1;
  margin-top:14px;
  color:#617e9d;
  font-size:14px;
  line-height:1.8;
  max-width:560px;
}
.claim-button-wrap{
  margin-top:22px;
  position:relative;
  z-index:1;
}
.claim-button{
  width:100%;
  min-height:58px;
  border:0;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  background:linear-gradient(90deg, #ffffff 0%, #e8f7ff 45%, #e6eeff 100%);
  color:var(--buttonText);
  font-size:20px;
  font-weight:1000;
  letter-spacing:.02em;
  box-shadow:
    0 12px 28px rgba(123,176,240,.20),
    0 0 0 1px rgba(147,205,255,.42) inset,
    0 0 14px rgba(176,209,255,.18);
  transition:transform .16s ease, filter .16s ease, box-shadow .16s ease;
}
.claim-button::after{
  content:"→";
  margin-left:10px;
  font-size:22px;
}
.claim-button:hover{
  filter:brightness(1.02);
  box-shadow:
    0 16px 32px rgba(123,176,240,.26),
    0 0 0 1px rgba(147,205,255,.5) inset,
    0 0 18px rgba(176,209,255,.24);
}
.claim-button:active{transform:scale(.988)}

.claim-safe{
  margin-top:12px;
  text-align:center;
  color:#7090b0;
  font-size:12px;
  font-weight:800;
}
.claim-safe::before{
  content:"";
  display:inline-block;
  width:8px;
  height:8px;
  margin-right:7px;
  border-radius:50%;
  background:#75dbff;
  box-shadow:0 0 10px #75dbff;
  vertical-align:middle;
}

.footer{
  margin-top:14px;
  text-align:center;
  color:#6e86a3;
  font-size:11px;
  line-height:1.6;
}

@media(max-width:560px){
  .page{padding:12px 10px 32px}
  .hero{border-radius:18px}
  h1{font-size:31px}
  .info{padding:13px}
  .row{gap:10px;padding:12px}
  .label{flex-basis:84px;font-size:12px}
  .value{font-size:13px}
  .claim-panel{padding:18px;border-radius:22px}
  .claim-title .line1,
  .claim-title .line2{font-size:32px}
  .claim-button{font-size:18px;min-height:54px}
}
</style>
</head>

<body>

<div class="bg-grid"></div>
<div class="glow one"></div>
<div class="glow two"></div>

<main class="page">

  <section class="hero">
    <img id="hero-image" alt="">
  </section>

  <section class="intro">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </section>

  <section class="info">
    <div class="row">
      <div class="label" id="reward-label"></div>
      <div class="value" id="reward-text"></div>
    </div>
    <div class="row">
      <div class="label" id="time-label"></div>
      <div class="value" id="time-text"></div>
    </div>
  </section>

  <section class="claim-panel">
    <div class="claim-tag" id="claim-tag"></div>

    <div class="claim-title">
      <span class="line1" id="claim-line1"></span>
      <span class="line2" id="claim-line2"></span>
    </div>

    <div class="claim-desc" id="claim-desc"></div>

    <div class="claim-button-wrap">
      <a
        id="claim-button"
        class="claim-button"
        href="#"
        rel="noopener noreferrer">
      </a>
    </div>

    <div class="claim-safe" id="claim-safe"></div>
  </section>

  <div class="footer" id="footer"></div>

</main>

<script>
const $ = (id) => document.getElementById(id);

document.title = CONFIG.pageTitle;

$("hero-image").src = CONFIG.heroImage;
$("hero-image").alt = CONFIG.heroAlt;

$("eyebrow").textContent = CONFIG.eyebrow;
$("title").textContent = CONFIG.title;
$("subtitle").textContent = CONFIG.subtitle;

$("reward-label").textContent = CONFIG.rewardLabel;
$("reward-text").textContent = CONFIG.rewardText;

$("time-label").textContent = CONFIG.timeLabel;
$("time-text").textContent = CONFIG.timeText;

$("claim-tag").textContent = CONFIG.claimTag;
$("claim-line1").textContent = CONFIG.claimTitleLine1;
$("claim-line2").textContent = CONFIG.claimTitleLine2;
$("claim-desc").textContent = CONFIG.claimDesc;
$("claim-button").textContent = CONFIG.claimButtonText;
$("claim-button").href = CONFIG.lineLink;
$("claim-safe").textContent = CONFIG.claimSafeText;

$("footer").textContent = CONFIG.footerText;
</script>

</body>
</html>
